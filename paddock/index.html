<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juízes de Paddock — Torneio de Robótica Anchieta</title>
  
  <!-- Anti-cache estrito para navegadores móveis (Safari iOS e Chrome Android) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- CSS Compartilhado e Específico -->
  <link rel="stylesheet" href="../shared/css/design-tokens.css?v=20261106_ssot_v1">
  <link rel="stylesheet" href="css/paddock.css?v=20261106_ssot_v1">
</head>
<body class="paddock-body">

  <!-- Barra de Destaque Superior de 6px (Laranja Anchieta #F26522) -->
  <div class="anchieta-topbar"></div>

  <!-- Header Superior Mobile -->
  <header class="paddock-header">
    <div class="paddock-header-top">
      <div class="paddock-brand">
        <div class="paddock-logo-tag">ANCHIETA</div>
        <div class="paddock-title">
          <h1>JUÍZES DE PADDOCK</h1>
          <p id="paddockSubtitleEdition">Avaliação de Boxes & Bancadas &bull; 05/12/2026</p>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <!-- Botão Voltar ao Hub Central -->
        <a href="../index.html" class="btn-hub-nav" title="Voltar à Central do Torneio" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">
          <span>🏠 Início</span>
        </a>

        <!-- Botão de Sincronização / Atualização Rápida -->
        <button type="button" id="btnRefreshTeams" class="btn-refresh-teams" title="Atualizar dados da nuvem" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 6px; padding: 4px 8px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px;">
          <span>🔄</span>
        </button>

        <!-- Badge de Status de Conectividade -->
        <div id="cloudStatusBadge" class="badge-status cloud-offline" style="padding: 4px 10px; font-size: 0.75rem;">
          <span class="status-dot"></span>
          <span id="cloudStatusText">Nuvem...</span>
        </div>
      </div>
    </div>

    <!-- Identificação do Juiz -->
    <div class="judge-profile-strip">
      <div class="judge-name-display">
        <span>👨‍⚖️ Juiz:</span>
        <strong id="activeJudgeName">Não Identificado</strong>
      </div>
      <button type="button" id="btnChangeJudge" class="btn-edit-judge">Alterar</button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="paddock-container">

    <!-- 1. Seleção da Equipe -->
    <section class="mobile-card">
      <div class="mobile-card-title">
        <span>1. Selecionar Equipe</span>
        <span id="evaluatedStatusBadge" class="evaluated-badge pending">⏳ Pendente</span>
      </div>

      <select id="selectTeamPaddock" class="team-picker-select">
        <option value="">Carregando equipes...</option>
      </select>

      <div class="team-info-banner">
        <div class="team-info-details">
          <h2 id="paddockTeamName">--</h2>
          <p id="paddockTeamSchool">--</p>
        </div>
        <div id="paddockTeamCat" class="badge-pill-light" style="background: var(--color-primary); color: #fff; padding: 4px 12px;">
          LEGO
        </div>
      </div>
    </section>

    <!-- Formulário de Avaliação Renderizado Dinamicamente via config/regrasTorneio.js -->
    <form id="formPaddockEval">

      <!-- Container Dinâmico dos Critérios de Rubrica e Escala de Notas -->
      <div id="dynamicRubricsContainer">
        <!-- Preenchido dinamicamente por paddock.js consumindo window.REGRAS_TORNEIO -->
      </div>

      <!-- Observações Gerais -->
      <section class="mobile-card">
        <div class="mobile-card-title">
          <span id="labelObservacoesGerais">📝 Observações Gerais</span>
        </div>
        <textarea id="inputObservacoes" class="textarea-notes" placeholder="Observações, pontos fortes ou justificativas para a comissão julgadora..."></textarea>
      </section>

      <!-- Botão de Envio Oficial -->
      <div class="submit-action-bar">
        <button type="submit" id="btnSubmitEval" class="btn-submit-eval">
          <span>🚀 ENVIAR AVALIAÇÃO OFICIAL</span>
        </button>
      </div>

    </form>

    <!-- Histórico de Avaliações Feitas pelo Juiz Atual -->
    <section class="mobile-card" style="margin-top: 24px;">
      <button type="button" id="btnToggleHistory" class="history-accordion-toggle">
        <span>📋 Minhas Avaliações Enviadas (<span id="myEvalsCount">0</span>)</span>
        <span id="accordionArrow" style="margin-left: auto;">▼</span>
      </button>

      <div id="myEvalsContainer" style="display: none; margin-top: 12px;">
        <!-- Preenchido via JavaScript -->
      </div>
    </section>

  </main>

  <!-- Scripts com Configuração Centralizada (Single Source of Truth) -->
  <script src="../config/regrasTorneio.js?v=20261106_ssot_v1"></script>
  <script src="../shared/js/cloud-api.js?v=20261106_ssot_v1"></script>
  <script src="../shared/js/teams-data.js?v=20261106_ssot_v1"></script>
  <script src="js/paddock.js?v=20261106_ssot_v1"></script>
</body>
</html>
